name: hexstt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hexstt/**"
      - ".github/workflows/hexstt.yml"
  push:
    branches: [dev]
    paths:
      - "hexstt/**"
      - ".github/workflows/hexstt.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  min:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: C++ build tools for transcribe.cpp
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang pkg-config
      - name: Test the WAV parser
        working-directory: hexstt
        run: cargo test --locked
      - name: Build the size profile
        working-directory: hexstt
        run: cargo build --locked --profile min
      - name: Upload the min-profile binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hexstt-min-x86_64
          path: hexstt/target/min/hexstt
          if-no-files-found: error
